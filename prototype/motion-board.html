<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- PROTOTYPE frame harness: renders ONE animation, frozen on one step, for design-board screenshots.
     motion-board.html?anim=map&motion=full&freeze=2&w=1100&h=470&theme=onblue  Throwaway. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  body.onblue { background: var(--blue); }
  .frame { box-sizing: border-box; padding: 24px; }
  .anim { position: relative; --a-ink:#16150f; --a-muted:#55534a; --a-soft:#c9c6bc; --a-paper:#fafaf6; --a-accent:#2242e8; --a-accent-soft:#b9c4f7; --a-alert:#c2412d; }
  .anim[data-theme="onblue"] { --a-ink:#fafaf6; --a-muted:#e6e9fd; --a-soft:rgba(250,250,246,0.42); --a-paper:#2242e8; --a-accent:#fafaf6; --a-accent-soft:rgba(250,250,246,0.22); --a-alert:#ffd166; color:#fafaf6; }
  .anim > canvas, .anim > svg { display: block; width: 100%; height: 100%; }
  .stats-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat2 { position: relative; padding: 36px 64px; display: flex; align-items: baseline; gap: 20px; }
  .stat2 + .stat2 { border-left: 1px solid var(--rule); }
  .stat2-value { font-size: 88px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .stat2-accent { color: var(--blue); }
  .stat2-label { font-size: 15px; font-weight: 500; color: var(--muted); max-width: 180px; }
  .count-rule { position: absolute; left: 64px; right: 64px; bottom: 0; height: 2px; background: var(--blue); transform: scaleX(0); transform-origin: left; }
</style>
</head>
<body>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var anim = p.get('anim') || 'map', w = +(p.get('w') || 1100), h = +(p.get('h') || 470), theme = p.get('theme');
    if (theme === 'onblue') document.body.className = 'onblue';
    var frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.width = w + 'px';
    if (anim === 'count') {
      frame.innerHTML =
        '<section class="stats-2 anim" data-anim="count" aria-label="Highlights">' +
        '<div class="stat2"><div class="stat2-value"><span class="count" data-to="7" data-suffix="+">7+</span></div><div class="stat2-label">Years in data</div><div class="count-rule" aria-hidden="true"></div></div>' +
        '<div class="stat2"><div class="stat2-value stat2-accent"><span class="count" data-to="400" data-prefix="$" data-suffix="K+">$400K+</span></div><div class="stat2-label">Saved every year</div><div class="count-rule" aria-hidden="true"></div></div>' +
        '</section>';
    } else {
      var el = document.createElement('div');
      el.className = 'anim';
      el.dataset.anim = anim;
      if (theme) el.dataset.theme = theme;
      el.style.width = (w - 48) + 'px';
      el.style.height = (h - 48) + 'px';
      frame.appendChild(el);
    }
    document.body.appendChild(frame);
  })();
</script>
<script src="motion/core.js"></script>
<script src="motion/map.js"></script>
<script src="motion/doors.js"></script>
<script src="motion/count.js"></script>
<script src="motion/skyline.js"></script>
<script src="motion/curve.js"></script>
<script src="motion/shap.js"></script>
<script src="motion/stairs.js"></script>
</body>
</html>
